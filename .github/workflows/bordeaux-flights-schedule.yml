name: Suivi vols Bordeaux

on:
  schedule:
    # Tous les horaires sont en UTC (GitHub Actions ne connaît pas les fuseaux
    # horaires locaux). Calculés pour Paris en heure d'été (CEST, UTC+2),
    # valable jusqu'à fin octobre 2026. À la bascule en heure d'hiver
    # (dernier dimanche d'octobre), décalez chaque ligne d'une heure PLUS
    # TARD en UTC pour rester aligné sur les mêmes horaires locaux à Paris
    # (ex: "15 22 * * *" devient "15 23 * * *"). Inverse au retour de l'heure
    # d'été fin mars.
    - cron: "15 22 * * *"  # 00h15 Paris (jour suivant)
    - cron: "0 1 * * *"    # 03h00 Paris
    - cron: "30 5 * * *"   # 07h30 Paris
    - cron: "0 10 * * *"   # 12h00 Paris
    - cron: "30 12 * * *"  # 14h30 Paris
    - cron: "30 15 * * *"  # 17h30 Paris
    - cron: "30 17 * * *"  # 19h30 Paris
    - cron: "30 19 * * *"  # 21h30 Paris
    - cron: "0 21 * * *"   # 23h00 Paris
  workflow_dispatch: {}    # permet de déclencher un run manuel depuis l'onglet Actions

# Un seul relevé à la fois (04/10/2026) : GitHub peut lancer plusieurs relevés
# en retard presque en même temps ; ils attendent leur tour au lieu de se
# marcher dessus (le run #101 du 04/10 avait perdu son relevé ainsi).
concurrency:
  group: suivi-vols-bordeaux
  cancel-in-progress: false

jobs:
  fetch-flights:
    # Version figée (04/10/2026) : « ubuntu-latest » passe à Ubuntu 26 à partir
    # du 19/10/2026 ; on garde la version qui marche aujourd'hui.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Récupérer l'état actuel des vols (avec délai aléatoire intégré)
        env:
          EXPORT_WEBHOOK_URL: ${{ secrets.EXPORT_WEBHOOK_URL }}
        run: python bordeaux_flights_site_officiel.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl data/latest.json
          git commit -m "Vols Bordeaux $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || { echo "Rien à committer"; exit 0; }
          # Si un autre relevé a publié entre-temps, on récupère d'abord ses
          # données puis on renvoie (3 essais) ; en cas de conflit, échec visible.
          for essai in 1 2 3; do
            if git push; then exit 0; fi
            echo "Envoi refusé (essai $essai) : récupération des relevés publiés entre-temps"
            git pull --rebase origin main || { git rebase --abort; echo "Conflit : relevé non publié"; exit 1; }
          done
          exit 1
